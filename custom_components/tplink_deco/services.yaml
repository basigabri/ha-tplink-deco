reboot_deco:
  name: Reboot Deco
  description: Reboot Deco
  fields:
    device_id:
      name: Device ID(s)
      description: Device ID(s)
      required: true
      selector:
        device:
          integration: tplink_deco
          manufacturer: TP-Link Deco
          multiple: true
download_system_log:
  name: Download system log
  description: >-
    Save the Deco system log to the tplink_deco_logs folder of the Home
    Assistant config directory. Returns the file path and line count.
  fields:
    config_entry_id:
      name: Deco
      description: TP-Link Deco entry to download from. Required when more than one entry is loaded.
      required: false
      selector:
        config_entry:
          integration: tplink_deco
    filename:
      name: File name
      description: File name to save as. Defaults to deco-<timestamp>.log.
      required: false
      example: deco.log
      selector:
        text:
    log_level:
      name: Log level
      description: Minimum severity of log lines to include.
      required: false
      default: ALL
      selector:
        select:
          options:
            - ALERT
            - CRITICAL
            - ERROR
            - WARNING
            - NOTICE
            - INFO
            - DEBUG
            - ALL
block_client:
  name: Block client
  description: >-
    Cut a client off from the internet by adding it to the Deco blocklist, the
    same as Block in the Deco app.
  fields:
    config_entry_id:
      name: Deco
      description: TP-Link Deco entry to use. Required when more than one entry is loaded.
      required: false
      selector:
        config_entry:
          integration: tplink_deco
    mac_address:
      name: MAC address
      description: MAC address of the client to block.
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
unblock_client:
  name: Unblock client
  description: Restore a blocked client's internet access.
  fields:
    config_entry_id:
      name: Deco
      description: TP-Link Deco entry to use. Required when more than one entry is loaded.
      required: false
      selector:
        config_entry:
          integration: tplink_deco
    mac_address:
      name: MAC address
      description: MAC address of the client to unblock.
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
